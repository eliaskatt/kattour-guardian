name: Import Kattour Guardian v0.5.0 source update
on:
  push:
    branches: [main]
    paths:
      - '.import/guardian-v05-part3.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract source update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/guardian-release
          for i in $(seq 1 3); do
            test -s ".import/guardian-v05-part${i}.b64"
            cat ".import/guardian-v05-part${i}.b64"
          done | base64 --decode > /tmp/guardian-release/release.tar.xz
          echo '108f073627d0ddb64394857e357f66489b8b7bba7f0cdebe594f9a080381d511  /tmp/guardian-release/release.tar.xz' | sha256sum -c -
          tar -tJf /tmp/guardian-release/release.tar.xz | while IFS= read -r path; do
            case "$path" in /*|../*|*/../*|*/..) echo "Unsafe archive path: $path"; exit 1;; esac
          done
          tar -xJf /tmp/guardian-release/release.tar.xz -C .
          rm -rf .import
          rm -f .github/workflows/import-v05.yml
          test -f TOKEN_USAGE.md
          test -f skills/kattour-guardian/scripts/provider_usage.py
          test -f .github/workflows/security.yml
      - name: Validate version and regression tests
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
          python skills/kattour-guardian/scripts/security_scan.py . --fail-on high
      - name: Confirm English-only sources
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('.').rglob('*'):
              if p.is_file() and p.suffix in {'.md','.py','.yml','.yaml','.txt'} and '.git' not in p.parts:
                  content = p.read_text(encoding='utf-8')
                  assert not any('\u0600' <= ch <= '\u06ff' for ch in content), p
          PY
      - name: Publish reviewed source files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .import
          rm -f .github/workflows/import-v05.yml
          rm -f .github/workflows/security.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Release Kattour Guardian v0.5.0: provider usage, quality triage and security checks'
          git push origin HEAD:main
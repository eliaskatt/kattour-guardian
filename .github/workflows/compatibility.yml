name: Skill and MCP compatibility smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline skill layout and real MCP process smoke test
        run: python scripts/compatibility_smoke.py --json
      - name: Compatibility test suite
        run: python -m unittest discover -s tests -p 'test_compatibility_smoke.py' -v

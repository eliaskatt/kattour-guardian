name: Import Kattour Guardian MCP v0.3.0
on:
  push:
    branches: [main]
    paths:
      - '.import/mcp-v03-part3.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract checked local patch
        shell: bash
        run: |
          set -euo pipefail
          cat .import/mcp-v03-part1.b64 .import/mcp-v03-part2.b64 .import/mcp-v03-part3.b64 | base64 --decode >/tmp/guardian-mcp.tar.xz
          printf '%s  %s\n' '0d612e7404d1d60fbf4ce9aed82178f7ecd4ccd4ee36e9f320c5bdf4e727100a' '/tmp/guardian-mcp.tar.xz' | sha256sum --check
          mkdir -p /tmp/guardian-patch
          tar -xJf /tmp/guardian-mcp.tar.xz -C /tmp/guardian-patch
          test -f /tmp/guardian-patch/mcp_server.py
          test -f /tmp/guardian-patch/tests/test_mcp_server.py
          cp -a /tmp/guardian-patch/. .
          rm -rf .import
          rm -f .github/workflows/import-mcp-v03.yml
      - name: Validate before committing
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v
          python skills/kattour-guardian/scripts/security_scan.py . --fail-on high
      - name: Publish versioned source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Release Kattour Guardian v0.3.0 with local MCP tools'
          git push origin HEAD:main
name: Import Guardian sources
on:
  push:
    branches: [main]
    paths:
      - ".import/part3.b64"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand reviewed source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import/part1.b64 .import/part2.b64 .import/part3.b64 | base64 -d >/tmp/guardian.tar.xz
          mkdir -p /tmp/guardian
          tar -xJf /tmp/guardian.tar.xz -C /tmp/guardian
          test -f /tmp/guardian/kattour-guardian/skills/kattour-guardian/SKILL.md
          cp -a /tmp/guardian/kattour-guardian/. .
          rm -rf .import
          rm -f .github/workflows/import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Kattour Guardian v0.2.0"
          git push origin HEAD:main

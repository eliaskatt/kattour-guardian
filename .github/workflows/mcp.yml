name: MCP server regression
on:
  push:
    paths:
      - 'mcp_server.py'
      - 'MCP.md'
      - 'tests/**'
      - 'skills/kattour-guardian/scripts/**'
      - '.github/workflows/mcp.yml'
  pull_request:
permissions:
  contents: read
jobs:
  stdio-protocol:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: MCP protocol tests
        run: python -m unittest discover -s tests -p 'test_mcp_server.py' -v

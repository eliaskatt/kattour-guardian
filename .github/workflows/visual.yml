name: Browser and token comparison checks
on:
  push:
    paths:
      - 'skills/kattour-guardian/scripts/browser_audit.py'
      - 'skills/kattour-guardian/scripts/token_compare.py'
      - 'tests/test_browser_audit.py'
      - 'tests/test_mcp_server.py'
      - 'mcp_server.py'
      - '.github/workflows/visual.yml'
  pull_request:
permissions:
  contents: read
jobs:
  playwright-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser integration
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run validation and tests
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests -v

name: Guardian v0.9 quality tools
on:
  push:
    paths:
      - 'scripts/pr_annotations.py'
      - 'scripts/visual_compare.py'
      - 'scripts/token_benchmark.py'
      - 'tests/test_pr_annotations.py'
      - 'tests/test_visual_compare.py'
      - 'tests/test_token_benchmark.py'
      - '.github/workflows/quality-tools.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tool-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional local image dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Test annotations, visual regression and token benchmark
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate skill metadata
        run: python scripts/validate.py

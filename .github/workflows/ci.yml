name: Validate skill package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate Agent Skills metadata and references
        run: python scripts/validate.py
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Run own heuristic scanner (high severity gate)
        run: python skills/kattour-guardian/scripts/security_scan.py . --fail-on high

name: Guardian Playground
on:
  push:
    branches: [main]
    paths:
      - 'playground/**'
      - '.github/workflows/playground.yml'
  pull_request:
    paths:
      - 'playground/**'
      - '.github/workflows/playground.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guardian-playground-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check modular source syntax
        run: node --check playground/src/app.js && node --check playground/src/engine.mjs
      - name: Run planning, security and sharing regression tests
        run: node --test playground/tests/engine.test.mjs
      - name: Verify offline release equals modular source
        run: node playground/scripts/build.mjs --check
      - name: Check English, privacy and adoption documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('playground/index.html').read_text('utf-8')
          assert '<html lang="en">' in page
          for marker in ('id="workMode"', 'id="targetAgent"', 'id="detailLevel"', 'id="shareBtn"', 'id="importFile"', 'data-tab="acceptance"'):
              assert marker in page, marker
          assert Path('playground/PRIVACY.md').is_file()
          assert Path('playground/GROWTH.md').is_file()
          print('PASS: feature markers, English UI, privacy docs')
          PY
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional browser integration
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Run desktop and mobile browser smoke tests
        run: |
          python playground/tests/browser-smoke.py
          python playground/tests/growth-browser-smoke.py
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [verify, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload offline workbench
        uses: actions/upload-pages-artifact@v4
        with:
          path: playground
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

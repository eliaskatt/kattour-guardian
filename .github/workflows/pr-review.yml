name: Kattour Guardian PR review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  review-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Scanner comes from trusted base commit, not the untrusted PR.
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Fetch bounded GitHub patch metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/fetch_pr_files.py --number "$PR_NUMBER" --out "$RUNNER_TEMP/pr_files.json"
      - name: Create read-only review summary
        run: |
          python scripts/pr_review.py --input "$RUNNER_TEMP/pr_files.json" --format markdown --max-findings 60 >> "$GITHUB_STEP_SUMMARY"
          python scripts/pr_review.py --input "$RUNNER_TEMP/pr_files.json" --format json --max-findings 60 > "$RUNNER_TEMP/guardian-pr-review.json"
      - name: Emit redacted GitHub Checks annotations
        run: python scripts/pr_annotations.py --input "$RUNNER_TEMP/guardian-pr-review.json" --max-annotations 30
      - name: Upload redacted findings (no source snippets)
        uses: actions/upload-artifact@v4
        with:
          name: guardian-pr-review
          path: ${{ runner.temp }}/guardian-pr-review.json
          retention-days: 7
